name: SKC Web - Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web-tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find docs/assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check docs/sw.js
      - name: Static validation
        run: python web-tests/validate_static.py
      - name: Functional smoke tests
        run: |
          node web-tests/store-smoke.mjs
          node web-tests/files-smoke.mjs
          node web-tests/sync-smoke.mjs
          node web-tests/excel-smoke.mjs
          python web-tests/validate_excel.py
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
