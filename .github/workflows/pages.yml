name: SKC Web 3.3.6 - Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'release/b64/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild SKC Web 3.3.6 archive
        run: |
          set -euo pipefail
          cat release/b64/part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/SKC_Facturas_Web_GitHub_3.3.6.zip
          echo '1d3eff8b8869bd5792c107d34b59e0c2d8f939cb4ab6bad7c2c49ac08421487e  /tmp/SKC_Facturas_Web_GitHub_3.3.6.zip' | sha256sum -c -
          unzip -t /tmp/SKC_Facturas_Web_GitHub_3.3.6.zip
          rm -rf site-src
          mkdir -p site-src
          unzip -q /tmp/SKC_Facturas_Web_GitHub_3.3.6.zip -d site-src
      - name: Static and syntax validation
        working-directory: site-src
        run: |
          python web-tests/validate_static.py
          find docs/assets -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check docs/sw.js
      - name: Functional smoke tests
        working-directory: site-src
        run: |
          node web-tests/store-smoke.mjs
          node web-tests/files-smoke.mjs
          node web-tests/sync-smoke.mjs
          node web-tests/excel-smoke.mjs
          node web-tests/portable-smoke.mjs
          python web-tests/validate_excel.py
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-src/docs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
